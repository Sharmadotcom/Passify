<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Passify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark">
<div class="auth-container">
    <div class="auth-left">
        <div class="auth-brand">
            <div class="auth-logo">🔍</div>
            <h1>Passify</h1>
        </div>
        <span class="hero-tag">ROUTING EXCEPTION</span>
        <h2>Lost.<br>In.<br>Space.</h2>
        <p>The page, resource, or vault record you are searching for does not exist or has been moved.</p>
    </div>
    <div class="auth-right">
        <div class="auth-card" style="text-align: center;">
            <h2 style="font-size: 2.5rem; margin-bottom: 8px; color: #f59e0b;">404</h2>
            <h3>Not Found</h3>
            <p class="auth-subtitle" style="margin-bottom: 32px; color: #9ca3af;">The requested address could not be located on this server.</p>
            <a href="/" class="auth-btn" style="display: inline-block; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; background: #6366f1; color: white; transition: background 0.2s;">Return Home</a>
        </div>
    </div>
</div>
</body>
</html>
